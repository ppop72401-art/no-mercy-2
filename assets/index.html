<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNO No Mercy - Enterprise Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           1. التصميم البصري المتقدم (Gamified & 120fps Optimized)
        ========================================================= */
        :root {
            --bg-deep: #050505; --glass-bg: rgba(20, 25, 35, 0.85); --glass-border: rgba(255, 255, 255, 0.15);
            --accent: #00f0ff; --accent-glow: rgba(0, 240, 255, 0.6);
            --red: #ff2a2a; --blue: #0066ff; --green: #00e640; --yellow: #ffcc00; --black: #1a1a1a;
            --font: 'Tajawal', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font); user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at top, #1a1a2e, var(--bg-deep)); color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* تسريع الأداء لـ 120fps */
        .hardware-accelerated { transform: translateZ(0); will-change: transform, opacity; }

        /* الحاويات */
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }

        /* أزرار الإغلاق (X) */
        .btn-close {
            position: absolute; top: 15px; left: 15px; width: 40px; height: 40px;
            background: rgba(255,0,0,0.2); border: 2px solid var(--red); color: white;
            border-radius: 50%; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000;
        }
        .btn-close:active { transform: scale(0.85); background: var(--red); }

        /* الأزرار العملية (أحجام مناسبة للأصابع) */
        .btn-ultra {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05)); color: white;
            font-size: 1.2rem; font-weight: 900; padding: 18px 30px; border-radius: 16px;
            border: 1px solid var(--glass-border); cursor: pointer; text-transform: uppercase;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; overflow: hidden;
            min-height: 60px; /* حجم عملي جداً */
        }
        .btn-ultra:active { transform: scale(0.92) translateZ(0); }
        .btn-ultra.primary { background: linear-gradient(135deg, #00f0ff, #0077ff); border-color: var(--accent); box-shadow: 0 10px 25px var(--accent-glow); color: #000; }
        .btn-ultra.danger { background: linear-gradient(135deg, #ff2a2a, #990000); box-shadow: 0 10px 25px rgba(255, 42, 42, 0.5); }
        .btn-ultra.disabled { filter: grayscale(1); opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; pointer-events: none; }

        input { width: 100%; padding: 20px; border-radius: 16px; font-size: 1.3rem; font-weight: bold; border: 2px solid var(--glass-border); background: rgba(0,0,0,0.6); color: var(--accent); margin-bottom: 25px; text-align: center; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }

        /* نظام الشاشات */
        .screen { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; }
        .screen.active { display: flex; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        .center-box { margin: auto; padding: 40px 30px; width: 92%; max-width: 450px; text-align: center; position: relative; }

        /* البطاقات ثلاثية الأبعاد الاحترافية */
        .card-3d {
            width: 80px; height: 120px; border-radius: 14px; display: flex; flex-direction: column; justify-content: space-between; padding: 8px;
            font-size: 2rem; font-weight: 900; cursor: pointer; 
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s, margin 0.2s;
            position: relative; border: 2px solid rgba(255,255,255,0.4); box-shadow: 0 12px 24px rgba(0,0,0,0.8);
            transform-origin: bottom center; will-change: transform;
        }
        .card-3d::before { content: ''; position: absolute; top:0; left:0; right:0; bottom:0; background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 50%); border-radius: 12px; pointer-events: none; }
        .card-3d::after { content: ''; position: absolute; top:4px; left:4px; right:4px; bottom:4px; border-radius: 8px; border: 3px solid rgba(255,255,255,0.2); pointer-events: none; }
        
        .card-3d.red { background: linear-gradient(135deg, var(--red), #800000); }
        .card-3d.blue { background: linear-gradient(135deg, var(--blue), #002266); }
        .card-3d.green { background: linear-gradient(135deg, var(--green), #004d1a); }
        .card-3d.yellow { background: linear-gradient(135deg, var(--yellow), #b38f00); color: black; border-color: rgba(0,0,0,0.3); }
        .card-3d.yellow::after { border-color: rgba(0,0,0,0.15); }
        .card-3d.yellow::before { background: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, transparent 50%); }
        .card-3d.black { background: linear-gradient(135deg, #444, var(--black)); border-color: var(--accent); }

        .c-val { align-self: center; text-shadow: 2px 3px 5px rgba(0,0,0,0.6); text-align: center; line-height: 1; margin-top: auto; margin-bottom: auto; }
        .card-3d.yellow .c-val { text-shadow: 1px 1px 0px rgba(255,255,255,0.5); }
        .c-val.sm { font-size: 1.2rem; }

        .card-3d.selected { transform: translateY(-35px) scale(1.15) !important; border-color: var(--accent); z-index: 100 !important; box-shadow: 0 20px 40px var(--accent-glow); margin: 0 15px; }
        .card-3d.disabled { filter: brightness(0.3) grayscale(0.9); cursor: not-allowed; }

        /* واجهة اللعب - HUD */
        .top-hud { display: flex; justify-content: space-between; padding: 20px; align-items: center; z-index: 10; gap: 10px; }
        .status-badge { padding: 12px 25px; border-radius: 16px; font-weight: 900; font-size: 1.1rem; flex: 1; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        
        .opponents-ring { display: flex; justify-content: center; gap: 15px; padding: 10px 20px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .opp-avatar { padding: 15px 25px; border-radius: 20px; text-align: center; font-weight: bold; transition: 0.3s; opacity: 0.5; min-width: 100px; }
        .opp-avatar.active { opacity: 1; border: 2px solid var(--accent); box-shadow: 0 0 25px var(--accent-glow); transform: scale(1.1); background: rgba(0, 240, 255, 0.1); }
        .opp-avatar.danger { background: rgba(255, 42, 42, 0.2); border-color: var(--red); animation: pulseAlert 0.6s infinite alternate; opacity: 1; }

        @keyframes pulseAlert { from { box-shadow: 0 0 10px var(--red); } to { box-shadow: 0 0 35px var(--red); } }

        .table-center { flex: 1; display: flex; justify-content: center; align-items: center; gap: 50px; position: relative; }
        
        /* شريط الأدوات العملي (الأزرار السفلية) */
        .action-bar { display: flex; justify-content: space-evenly; gap: 10px; padding: 15px; z-index: 50; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); }
        .action-btn { flex: 1; padding: 15px 10px; border-radius: 16px; font-weight: 900; font-size: 1.1rem; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; color: white; background: rgba(255,255,255,0.05); transition: 0.2s; backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .action-btn:active { transform: scale(0.9) translateZ(0); background: rgba(255,255,255,0.15); }
        .action-btn span { font-size: 1.5rem; } /* للإيموجي */

        .hand-container { height: 160px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 30px; overflow-x: auto; perspective: 1000px; -webkit-overflow-scrolling: touch; }
        .hand-container .card-3d { margin: 0 -15px; }
        .hand-container .card-3d:hover:not(.selected) { transform: translateY(-20px) rotateZ(3deg); z-index: 50; }

        #uno-call-btn { position: absolute; left: 20px; bottom: 180px; width: 90px; height: 90px; border-radius: 50%; font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0.3; transition: 0.3s; border: 4px solid #fff; }
        #uno-call-btn.alert { opacity: 1; transform: scale(1.1); animation: pulseAlert 0.4s infinite alternate; }

        /* النوافذ المنبثقة (Modals) */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 900; display: none; justify-content: center; align-items: center; backdrop-filter: blur(15px); }
        .modal.active { display: flex; animation: fadeIn 0.2s ease-out; }
        .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .color-btn { width: 100%; height: 110px; border-radius: 24px; cursor: pointer; border: 3px solid rgba(255,255,255,0.3); transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .color-btn:active { transform: scale(0.85); }

        /* نافذة كل الأوراق */
        #full-hand-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; overflow-y: auto; max-height: 60vh; padding: 20px 10px; }
        #full-hand-grid .card-3d { margin: 0; transform: none !important; }

        #toast-container { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 400px; }
        .toast { background: rgba(20, 25, 35, 0.95); backdrop-filter: blur(10px); border: 2px solid var(--accent); color: white; padding: 18px 25px; border-radius: 16px; font-weight: 900; font-size: 1.1rem; box-shadow: 0 15px 40px rgba(0,0,0,0.7); text-align: center; animation: slideDown 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, fadeOut 0.3s 2.5s forwards; }
        @keyframes slideDown { from { transform: translateY(-80px) scale(0.8); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.9); } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- شاشة الدخول -->
    <div id="screen-login" class="screen active hardware-accelerated">
        <div class="center-box glass-panel">
            <h1 style="font-size: 4.5rem; color: var(--red); margin-bottom: -15px; text-shadow: 0 0 30px rgba(255,42,42,0.8); font-style: italic;">UNO</h1>
            <h2 style="color: var(--yellow); margin-bottom: 40px; font-weight: 900; letter-spacing: 5px; text-shadow: 0 0 15px rgba(255,204,0,0.5);">NO MERCY</h2>
            <input type="text" id="playerName" placeholder="أدخل اسمك المستعار..." maxlength="12">
            <button class="btn-ultra primary" onclick="App.initNetwork(true)" style="width: 100%; margin-bottom: 15px;">إنشاء الخادم (مضيف)</button>
            <button class="btn-ultra" onclick="App.initNetwork(false)" style="width: 100%;">الاتصال بالخادم</button>
        </div>
    </div>

    <!-- شاشة الانتظار -->
    <div id="screen-lobby" class="screen hardware-accelerated">
        <div class="center-box glass-panel">
            <h2 style="margin-bottom: 25px; color: var(--accent); font-size: 2rem;">غرفة العمليات</h2>
            <div id="lobby-players" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 35px;"></div>
            <button id="btn-start-game" class="btn-ultra danger" style="display: none; width: 100%;" onclick="Engine.startGame()">بدء المذبحة 🔥</button>
            <p id="wait-msg" style="color: #94a3b8; font-weight: bold; font-size: 1.2rem;">في انتظار المضيف لبدء اللعب...</p>
        </div>
    </div>

    <!-- شاشة اللعب الرئيسية -->
    <div id="screen-game" class="screen hardware-accelerated">
        <div class="top-hud">
            <div class="status-badge glass-panel" id="hud-turn" style="color: var(--accent); border-color: var(--accent);"></div>
            <div class="status-badge glass-panel" id="hud-stack" style="color: var(--red); border-color: var(--red); display: none;"></div>
        </div>
        
        <div class="opponents-ring" id="opponents-ring"></div>

        <div class="table-center">
            <div class="card-3d black" onclick="UI.drawCard()" style="border: 3px solid var(--accent); box-shadow: 0 0 25px var(--accent-glow);">
                <div class="c-val sm" style="color: var(--accent);">سحب</div>
            </div>
            <div class="card-3d" id="top-card" style="box-shadow: 0 30px 60px rgba(0,0,0,1); margin: 0 20px; transform: scale(1.3);"></div>
        </div>

        <button class="btn-ultra danger" id="uno-call-btn" onclick="UI.callUno()">UNO</button>

        <div class="hand-container" id="my-hand"></div>

        <!-- شريط الأدوات العملي -->
        <div class="action-bar">
            <button class="action-btn" onclick="UI.sortHand()"><span>🔄</span>ترتيب</button>
            <button class="action-btn" onclick="UI.showFullHandModal()"><span>👀</span>كل الأوراق</button>
            <button class="btn-ultra primary disabled" id="btn-play-selected" style="flex: 2; border-radius: 20px;" onclick="UI.confirmPlay()">العب المحددة</button>
        </div>
    </div>

    <!-- نافذة اختيار اللون (مع زر X) -->
    <div class="modal" id="modal-color">
        <div class="center-box glass-panel">
            <button class="btn-close" onclick="UI.closeModal('modal-color')">✖</button>
            <h2 style="color: white; margin-bottom: 10px; font-size: 2rem;">قرر المصير</h2>
            <p style="color: #94a3b8; margin-bottom: 20px; font-size: 1.2rem;">اختر لون الساحة الجديد</p>
            <div class="color-grid">
                <div class="color-btn" style="background: linear-gradient(135deg, var(--red), #990000); border-color: var(--red);" onclick="UI.resolveColor('red')"></div>
                <div class="color-btn" style="background: linear-gradient(135deg, var(--blue), #003399); border-color: var(--blue);" onclick="UI.resolveColor('blue')"></div>
                <div class="color-btn" style="background: linear-gradient(135deg, var(--green), #00802b); border-color: var(--green);" onclick="UI.resolveColor('green')"></div>
                <div class="color-btn" style="background: linear-gradient(135deg, var(--yellow), #cc9900); border-color: var(--yellow);" onclick="UI.resolveColor('yellow')"></div>
            </div>
        </div>
    </div>

    <!-- نافذة قانون 7 (مع زر X) -->
    <div class="modal" id="modal-player-select">
        <div class="center-box glass-panel">
            <button class="btn-close" onclick="UI.closeModal('modal-player-select')">✖</button>
            <h2 style="color: var(--yellow); margin-bottom: 15px; font-size: 2rem;">قانون الـ 7!</h2>
            <p style="color: #94a3b8; margin-bottom: 20px; font-size: 1.2rem;">اختر ضحية لتبديل أوراقك معها:</p>
            <div id="player-select-list" style="display: flex; flex-direction: column; gap: 15px;"></div>
        </div>
    </div>

    <!-- نافذة عرض كل الأوراق (جديدة) -->
    <div class="modal" id="modal-full-hand">
        <div class="glass-panel" style="width: 95%; height: 85%; display: flex; flex-direction: column; position: relative; padding: 25px 15px; max-width: 600px; margin: auto;">
            <button class="btn-close" style="top: -15px; right: -15px; left: auto; background: var(--red); border-color: white;" onclick="UI.closeModal('modal-full-hand')">✖</button>
            <h2 style="text-align: center; color: var(--accent); margin-bottom: 20px; font-size: 2rem;">جميع أوراقك</h2>
            <div id="full-hand-grid"></div>
        </div>
    </div>

    <script>
        const Utils = {
            id: () => Math.random().toString(36).substr(2, 9),
            toast: (msg) => {
                let c = document.getElementById('toast-container');
                let t = document.createElement('div'); t.className = 'toast hardware-accelerated'; t.innerText = msg;
                c.appendChild(t); setTimeout(() => t.remove(), 2800);
            },
            switchScreen: (id) => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        };

        const Network = {
            ws: null, myId: Utils.id(), myName: "", isHost: false,
            state: { status: 'waiting', players: [], deck: [], discardPile: [], turnIdx: 0, direction: 1, stackAmount: 0, activeColor: '' },

            init: (asHost) => {
                let name = document.getElementById('playerName').value.trim();
                if(!name) return Utils.toast("حقل الاسم مطلوب للدخول!");
                Network.myName = name; Network.isHost = asHost;
                
                if(asHost) {
                    document.getElementById('btn-start-game').style.display = 'block';
                    document.getElementById('wait-msg').style.display = 'none';
                    Network.state.players.push({ id: Network.myId, name: Network.myName, hand: [], eliminated: false, calledUno: false });
                }

                Network.ws = new WebSocket(`ws://${location.host}/ws`);
                Network.ws.onopen = () => {
                    Utils.switchScreen('screen-lobby');
                    Network.ws.send(JSON.stringify({ type: 'join', id: Network.myId, name: Network.myName }));
                    if(asHost) UI.renderLobby();
                };

                Network.ws.onmessage = (e) => {
                    let data = JSON.parse(e.data);
                    if (Network.isHost && data.type === 'join' && data.id !== Network.myId) {
                        Network.state.players.push({ id: data.id, name: data.name, hand: [], eliminated: false, calledUno: false });
                        Network.broadcast();
                    } else if (Network.isHost && data.type === 'action') {
                        Engine.processAction(data.actionData);
                    } else if (data.type === 'state_update') {
                        Network.state = data.state;
                        if(Network.state.status === 'waiting') UI.renderLobby();
                        else if (Network.state.status === 'playing') UI.renderGame();
                    }
                };
            },
            broadcast: () => {
                if(!Network.isHost) return;
                Network.ws.send(JSON.stringify({ type: 'state_update', state: Network.state }));
                if(Network.state.status === 'waiting') UI.renderLobby(); else UI.renderGame();
            },
            sendAction: (data) => {
                if(Network.isHost) Engine.processAction(data);
                else Network.ws.send(JSON.stringify({ type: 'action', actionData: data }));
            }
        };

        const Engine = {
            startGame: () => {
                if(Network.state.players.length < 2) return Utils.toast("تحتاج لضحية أخرى على الأقل لبدء اللعب!");
                Network.state.deck = Engine.generateDeck();
                Network.state.players.forEach(p => { p.hand = []; for(let i=0; i<7; i++) p.hand.push(Network.state.deck.pop()); });

                let firstCard;
                do { firstCard = Network.state.deck.pop(); if(isNaN(firstCard.val) || firstCard.color === 'black') Network.state.deck.unshift(firstCard); } while (isNaN(firstCard.val) || firstCard.color === 'black');

                Network.state.discardPile = [firstCard]; Network.state.activeColor = firstCard.color;
                Network.state.status = 'playing'; Network.state.turnIdx = 0;
                Network.broadcast();
            },
            generateDeck: () => {
                let d = []; const colors = ['red', 'blue', 'green', 'yellow']; let idC = 0;
                colors.forEach(c => {
                    for(let i=1; i<=9; i++) { for(let j=0; j<3; j++) d.push({id: idC++, color: c, val: i.toString(), draw: 0}); }
                    d.push({id: idC++, color: c, val: '0', draw:0}); d.push({id: idC++, color: c, val: '0', draw:0});
                    d.push({id: idC++, color: c, val: '7', draw:0}); d.push({id: idC++, color: c, val: '7', draw:0});
                    for(let j=0; j<3; j++) { d.push({id: idC++, color: c, val: 'Skip', draw:0}); d.push({id: idC++, color: c, val: 'Rev', draw:0}); d.push({id: idC++, color: c, val: '+2', draw:2}); }
                    d.push({id: idC++, color: c, val: '+4', draw:4}); d.push({id: idC++, color: c, val: '+4', draw:4});
                });
                for(let i=0; i<6; i++) { d.push({id: idC++, color: 'black', val: 'W', draw:0}); d.push({id: idC++, color: 'black', val: 'W+6', draw:6}); d.push({id: idC++, color: 'black', val: 'W+10', draw:10}); }
                return d.sort(() => Math.random() - 0.5);
            },
            processAction: (act) => {
                let s = Network.state; let activeP = s.players[s.turnIdx];
                if(act.playerId !== activeP.id) return;

                if(act.type === 'play_card') {
                    let p = s.players.find(pl => pl.id === act.playerId);
                    let cIdx = p.hand.findIndex(c => c.id === act.cardId);
                    if(cIdx === -1) return;
                    let card = p.hand[cIdx];
                    let topCard = s.discardPile[s.discardPile.length-1];

                    // تم إصلاح منطق التحقق من الأسرار والبطاقات الخاصة
                    if(s.stackAmount > 0) {
                        if(card.draw === 0 || card.draw < topCard.draw) return; // تراكم فقط للأوراق الأكبر أو المساوية
                    } else {
                        if(card.color !== 'black' && card.color !== s.activeColor && card.val !== topCard.val) return;
                    }

                    p.hand.splice(cIdx, 1); s.discardPile.push(card);
                    
                    if(card.color !== 'black') s.activeColor = card.color; 
                    else if(act.selectedColor) s.activeColor = act.selectedColor;
                    
                    if(card.draw > 0) s.stackAmount += card.draw;
                    
                    let skips = 1;
                    if(card.val === 'Rev') s.direction *= -1;
                    if(card.val === 'Skip' || (card.val === 'Rev' && s.players.filter(pl=>!pl.eliminated).length === 2)) skips = 2;

                    // تفعيل الأسرار
                    if(card.val === '0') Engine.passHands();
                    if(card.val === '7' && act.targetId) Engine.swapHands(act.playerId, act.targetId);

                    if(p.hand.length === 0) { s.status = 'finished'; Network.broadcast(); return; }
                    Engine.advanceTurn(skips);
                } 
                else if (act.type === 'draw_card') {
                    let p = s.players.find(pl => pl.id === act.playerId);
                    let draws = s.stackAmount > 0 ? s.stackAmount : 1;
                    for(let i=0; i<draws; i++) {
                        if(s.deck.length === 0) break;
                        p.hand.push(s.deck.pop());
                        if(p.hand.length >= 25) { p.eliminated = true; break; } 
                    }
                    s.stackAmount = 0;
                    if(s.players.filter(pl=>!pl.eliminated).length <= 1) { s.status = 'finished'; Network.broadcast(); return; }
                    Engine.advanceTurn(1);
                }
                Network.broadcast();
            },
            advanceTurn: (steps) => {
                let s = Network.state;
                do { 
                    s.turnIdx = (s.turnIdx + (s.direction * steps) + s.players.length) % s.players.length; 
                    steps = 1; 
                } while (s.players[s.turnIdx].eliminated);
            },
            passHands: () => {
                let active = Network.state.players.filter(p => !p.eliminated);
                if(Network.state.direction === 1) { let temp = [...active[0].hand]; for(let i=0; i<active.length-1; i++) active[i].hand = [...active[i+1].hand]; active[active.length-1].hand = temp; } 
                else { let temp = [...active[active.length-1].hand]; for(let i=active.length-1; i>0; i--) active[i].hand = [...active[i-1].hand]; active[0].hand = temp; }
            },
            swapHands: (id1, id2) => {
                let p1 = Network.state.players.find(p=>p.id === id1); let p2 = Network.state.players.find(p=>p.id === id2);
                let temp = [...p1.hand]; p1.hand = [...p2.hand]; p2.hand = temp;
            }
        };

        const UI = {
            selectedCardId: null, pendingPlay: null,
            
            closeModal: (id) => { document.getElementById(id).classList.remove('active'); UI.pendingPlay = null; },

            renderLobby: () => {
                let html = ''; Network.state.players.forEach(p => { html += `<div class="glass-panel" style="padding: 18px; text-align: right; padding-right:25px; font-weight:900; font-size:1.2rem;">👤 ${p.name}</div>`; });
                document.getElementById('lobby-players').innerHTML = html;
            },
            renderGame: () => {
                Utils.switchScreen('screen-game');
                let s = Network.state; let me = s.players.find(p => p.id === Network.myId); let activeP = s.players[s.turnIdx]; let isMyTurn = (activeP.id === Network.myId);

                document.getElementById('hud-turn').innerText = `دور: ${activeP.name}`;
                let stackEl = document.getElementById('hud-stack');
                if(s.stackAmount > 0) { stackEl.innerText = `⚠️ تراكم: +${s.stackAmount}`; stackEl.style.display = 'block'; } else stackEl.style.display = 'none';

                let oppHtml = '';
                s.players.forEach(p => {
                    if(p.id !== Network.myId && !p.eliminated) {
                        let classes = 'opp-avatar glass-panel hardware-accelerated'; if(p.id === activeP.id) classes += ' active'; if(p.hand.length >= 20) classes += ' danger';
                        oppHtml += `<div class="${classes}">${p.name}<br><span style="font-size:1rem; color:#94a3b8; font-weight:bold;">${p.hand.length} أوراق</span></div>`;
                    }
                });
                document.getElementById('opponents-ring').innerHTML = oppHtml;

                let topCard = s.discardPile[s.discardPile.length - 1];
                let tcColor = topCard.color === 'black' ? s.activeColor : topCard.color;
                document.getElementById('top-card').className = `card-3d ${tcColor} hardware-accelerated`;
                document.getElementById('top-card').innerHTML = `<div class="c-val ${topCard.val.length > 2 ? 'sm':''}">${topCard.val}</div>`;

                let handHtml = '';
                if(me.eliminated) { handHtml = `<h2 style="color:var(--red); font-size:2rem;">💀 تم طردك (قاعدة الرحمة)</h2>`; } 
                else {
                    me.hand.forEach((c, idx) => {
                        let isSel = (UI.selectedCardId === c.id) ? 'selected' : '';
                        let isValid = (s.stackAmount === 0 && (c.color === 'black' || c.color === s.activeColor || c.val === topCard.val)) || (s.stackAmount > 0 && c.draw > 0 && c.draw >= topCard.draw);
                        let dis = (!isMyTurn || !isValid) ? 'disabled' : '';
                        handHtml += `<div class="card-3d ${c.color} ${isSel} ${dis} hardware-accelerated" style="z-index:${isSel? 100 : idx}" onclick="UI.selectCard('${c.id}', ${isMyTurn}, ${isValid})"><div class="c-val ${c.val.length > 2 ? 'sm':''}">${c.val}</div></div>`;
                    });
                }
                document.getElementById('my-hand').innerHTML = handHtml;

                let playBtn = document.getElementById('btn-play-selected');
                if(UI.selectedCardId && isMyTurn) { playBtn.classList.remove('disabled'); playBtn.classList.add('active'); } 
                else { playBtn.classList.add('disabled'); playBtn.classList.remove('active'); }

                let unoBtn = document.getElementById('uno-call-btn');
                if(me.hand.length === 2 && !me.calledUno) unoBtn.classList.add('alert'); else unoBtn.classList.remove('alert');
            },
            selectCard: (id, isMyTurn, isValid) => {
                if(!isMyTurn) return Utils.toast("انتظر دورك بصبر!");
                if(!isValid) return Utils.toast("لا يمكنك لعب هذه الورقة الآن!");
                UI.selectedCardId = (UI.selectedCardId === id) ? null : id;
                UI.renderGame();
            },
            confirmPlay: () => {
                if(!UI.selectedCardId) return;
                let me = Network.state.players.find(p => p.id === Network.myId);
                let card = me.hand.find(c => c.id === UI.selectedCardId);
                
                if(card.color === 'black') { 
                    UI.pendingPlay = { type: 'play_card', playerId: Network.myId, cardId: card.id }; 
                    document.getElementById('modal-color').classList.add('active'); 
                } 
                else if (card.val === '7') { 
                    UI.pendingPlay = { type: 'play_card', playerId: Network.myId, cardId: card.id }; 
                    UI.showPlayerSelectModal(); 
                } 
                else { 
                    Network.sendAction({ type: 'play_card', playerId: Network.myId, cardId: card.id }); 
                    UI.selectedCardId = null; 
                }
            },
            resolveColor: (col) => { 
                document.getElementById('modal-color').classList.remove('active'); 
                if(UI.pendingPlay) { 
                    UI.pendingPlay.selectedColor = col; 
                    Network.sendAction(UI.pendingPlay); 
                    UI.pendingPlay = null; 
                    UI.selectedCardId = null; 
                } 
            },
            showPlayerSelectModal: () => {
                let html = ''; 
                Network.state.players.forEach(p => { 
                    if(p.id !== Network.myId && !p.eliminated) { 
                        html += `<button class="btn-ultra" style="text-transform:none;" onclick="UI.resolvePlayer7('${p.id}')">${p.name} (${p.hand.length} ورقة)</button>`; 
                    } 
                });
                document.getElementById('player-select-list').innerHTML = html; 
                document.getElementById('modal-player-select').classList.add('active');
            },
            resolvePlayer7: (targetId) => { 
                document.getElementById('modal-player-select').classList.remove('active'); 
                if(UI.pendingPlay) { 
                    UI.pendingPlay.targetId = targetId; 
                    Network.sendAction(UI.pendingPlay); 
                    UI.pendingPlay = null; 
                    UI.selectedCardId = null; 
                } 
            },
            drawCard: () => { 
                let activeP = Network.state.players[Network.state.turnIdx]; 
                if(activeP.id !== Network.myId) return Utils.toast("ليس دورك!"); 
                Network.sendAction({ type: 'draw_card', playerId: Network.myId }); 
            },
            sortHand: () => { 
                let me = Network.state.players.find(p => p.id === Network.myId); 
                me.hand.sort((a,b) => a.color.localeCompare(b.color)); 
                UI.renderGame(); Utils.toast("تم ترتيب الأوراق بنجاح! 🪄"); 
            },
            showFullHandModal: () => { 
                let me = Network.state.players.find(p => p.id === Network.myId);
                let html = '';
                me.hand.forEach((c) => {
                    html += `<div class="card-3d ${c.color}"><div class="c-val ${c.val.length > 2 ? 'sm':''}">${c.val}</div></div>`;
                });
                document.getElementById('full-hand-grid').innerHTML = html;
                document.getElementById('modal-full-hand').classList.add('active');
            },
            callUno: () => { 
                let me = Network.state.players.find(p => p.id === Network.myId); 
                me.calledUno = true; Utils.toast("أونو! تم تأكيد النداء 🚀"); 
                UI.renderGame(); 
            }
        };

        const App = { initNetwork: Network.init };
    </script>
</body>
</html>
