<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNO No Mercy - Enterprise Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           1. التصميم البصري المتقدم (Glassmorphism & 3D)
        ========================================================= */
        :root {
            --bg-deep: #020617; --glass-bg: rgba(30, 41, 59, 0.7); --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.5);
            --red: #ef4444; --blue: #3b82f6; --green: #22c55e; --yellow: #eab308; --black: #1e293b;
            --font: 'Tajawal', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font); user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at center, #0f172a, var(--bg-deep)); color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* حاويات الزجاج (Glass Panels) */
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

        /* الأزرار العملية والاحترافية */
        .btn-ultra {
            background: linear-gradient(135deg, var(--surface-light), var(--surface)); color: white;
            font-size: 1.1rem; font-weight: 900; padding: 15px 30px; border-radius: 16px;
            border: 1px solid var(--glass-border); cursor: pointer; text-transform: uppercase;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; overflow: hidden;
        }
        .btn-ultra::before { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: 0.5s; }
        .btn-ultra:hover::before { left: 100%; }
        .btn-ultra:active { transform: scale(0.95); }
        .btn-ultra.primary { background: linear-gradient(135deg, #0ea5e9, #0284c7); border-color: var(--accent); box-shadow: 0 10px 20px var(--accent-glow); }
        .btn-ultra.danger { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 10px 20px rgba(239, 68, 68, 0.4); }
        .btn-ultra.disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        input { width: 100%; padding: 18px; border-radius: 16px; font-size: 1.2rem; font-weight: bold; border: 2px solid var(--glass-border); background: rgba(0,0,0,0.5); color: white; margin-bottom: 20px; text-align: center; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

        /* نظام الشاشات */
        .screen { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; }
        .screen.active { display: flex; }
        .center-box { margin: auto; padding: 40px; width: 90%; max-width: 450px; text-align: center; }

        /* البطاقات ثلاثية الأبعاد */
        .card-3d {
            width: 75px; height: 115px; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; padding: 6px;
            font-size: 1.8rem; font-weight: 900; cursor: pointer; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
            position: relative; border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 10px 20px rgba(0,0,0,0.6);
        }
        .card-3d::after { content: ''; position: absolute; top:2px; left:2px; right:2px; bottom:2px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1); pointer-events: none; }
        .card-3d.red { background: linear-gradient(135deg, var(--red), #991b1b); }
        .card-3d.blue { background: linear-gradient(135deg, var(--blue), #1e3a8a); }
        .card-3d.green { background: linear-gradient(135deg, var(--green), #14532d); }
        .card-3d.yellow { background: linear-gradient(135deg, var(--yellow), #854d0e); color: black; }
        .card-3d.yellow::after { border-color: rgba(0,0,0,0.1); }
        .card-3d.black { background: linear-gradient(135deg, #334155, #0f172a); }

        .c-val { align-self: center; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); text-align: center; }
        .card-3d.yellow .c-val { text-shadow: none; }
        .c-val.sm { font-size: 1.1rem; }

        .card-3d.selected { transform: translateY(-25px) scale(1.1); border: 3px solid var(--accent); z-index: 100 !important; box-shadow: 0 15px 30px var(--accent-glow); }
        .card-3d.disabled { filter: brightness(0.4) grayscale(0.8); cursor: not-allowed; }

        /* واجهة اللعب المعقدة */
        .top-hud { display: flex; justify-content: space-between; padding: 15px 25px; align-items: center; z-index: 10; }
        .status-badge { padding: 10px 20px; border-radius: 12px; font-weight: bold; font-size: 1.1rem; }
        
        .opponents-ring { display: flex; justify-content: center; gap: 15px; padding: 10px; overflow-x: auto; }
        .opp-avatar { padding: 12px 20px; border-radius: 16px; text-align: center; font-weight: bold; transition: 0.3s; opacity: 0.6; }
        .opp-avatar.active { opacity: 1; border: 2px solid var(--accent); box-shadow: 0 0 20px var(--accent-glow); transform: scale(1.05); }
        .opp-avatar.danger { background: rgba(239, 68, 68, 0.2); border-color: var(--red); animation: pulse 0.5s infinite alternate; }

        @keyframes pulse { from { box-shadow: 0 0 10px var(--red); } to { box-shadow: 0 0 30px var(--red); } }

        .table-center { flex: 1; display: flex; justify-content: center; align-items: center; gap: 40px; position: relative; }
        
        /* شريط الأدوات العملي (الأزرار السفلية) */
        .action-bar { display: flex; justify-content: center; gap: 15px; padding: 10px; z-index: 50; }
        .action-btn { padding: 12px 20px; border-radius: 12px; font-weight: bold; font-size: 1rem; border: none; cursor: pointer; color: white; background: rgba(255,255,255,0.1); transition: 0.2s; backdrop-filter: blur(10px); }
        .action-btn:hover { background: rgba(255,255,255,0.2); }
        .action-btn:active { transform: scale(0.9); }

        .hand-container { height: 150px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 30px; overflow-x: auto; perspective: 1000px; }
        .hand-container .card-3d { margin: 0 -20px; }
        .hand-container .card-3d:hover:not(.selected) { transform: translateY(-15px) rotateY(10deg); z-index: 50; }

        #uno-call-btn { position: absolute; left: 30px; bottom: 180px; width: 80px; height: 80px; border-radius: 50%; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0.4; }
        #uno-call-btn.alert { opacity: 1; animation: pulse 0.5s infinite alternate; }

        /* الموديلات */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 900; display: none; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .modal.active { display: flex; }
        .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .color-btn { width: 90px; height: 90px; border-radius: 24px; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); transition: 0.2s; }
        .color-btn:active { transform: scale(0.9); }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--accent); color: white; padding: 15px 30px; border-radius: 16px; font-weight: bold; font-size: 1.1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideIn 0.3s forwards, fadeOut 0.3s 2.5s forwards; }
        @keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- شاشة الدخول -->
    <div id="screen-login" class="screen active">
        <div class="center-box glass-panel">
            <h1 style="font-size: 4rem; color: var(--red); margin-bottom: -10px; text-shadow: 0 0 20px rgba(239,68,68,0.5);">UNO</h1>
            <h2 style="color: var(--yellow); margin-bottom: 40px; font-weight: 900; letter-spacing: 3px;">NO MERCY</h2>
            <input type="text" id="playerName" placeholder="الاسم المستعار..." maxlength="12">
            <button class="btn-ultra primary" onclick="App.initNetwork(true)" style="width: 100%; margin-bottom: 15px;">إنشاء الخادم (مضيف)</button>
            <button class="btn-ultra" onclick="App.initNetwork(false)" style="width: 100%;">الاتصال بالخادم</button>
        </div>
    </div>

    <!-- شاشة الانتظار -->
    <div id="screen-lobby" class="screen">
        <div class="center-box glass-panel">
            <h2 style="margin-bottom: 20px; color: var(--accent);">غرفة العمليات</h2>
            <div id="lobby-players" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px;"></div>
            <button id="btn-start-game" class="btn-ultra danger" style="display: none; width: 100%;" onclick="Engine.startGame()">تهيئة المذبحة 🔥</button>
            <p id="wait-msg" style="color: #94a3b8; font-weight: bold;">جاري انتظار المضيف لختم الأبواب...</p>
        </div>
    </div>

    <!-- شاشة اللعب الرئيسية -->
    <div id="screen-game" class="screen">
        <div class="top-hud">
            <div class="status-badge glass-panel" id="hud-turn" style="color: var(--accent);"></div>
            <div class="status-badge glass-panel" id="hud-stack" style="color: var(--red); display: none;"></div>
        </div>
        
        <div class="opponents-ring" id="opponents-ring"></div>

        <div class="table-center">
            <div class="card-3d black" onclick="UI.drawCard()" style="border: 2px solid white;">
                <div class="c-val sm">سحب</div>
            </div>
            <div class="card-3d" id="top-card" style="box-shadow: 0 20px 50px rgba(0,0,0,0.8); margin: 0 30px; transform: scale(1.2);"></div>
        </div>

        <!-- الأزرار العملية الجديدة -->
        <div class="action-bar">
            <button class="action-btn" onclick="UI.sortHand()">🔄 رتب أوراقي</button>
            <button class="action-btn" onclick="UI.showFullHand()">👀 اللوحة الكاملة</button>
            <button class="btn-ultra primary disabled" id="btn-play-selected" style="padding: 10px 30px;" onclick="UI.confirmPlay()">العب المحددة 👆</button>
        </div>

        <button class="btn-ultra danger" id="uno-call-btn" onclick="UI.callUno()">UNO</button>

        <div class="hand-container" id="my-hand"></div>
    </div>

    <!-- النوافذ (Modals) -->
    <div class="modal" id="modal-color">
        <div class="center-box glass-panel">
            <h2 style="color: white; margin-bottom: 10px;">قرر المصير</h2>
            <p style="color: #94a3b8; margin-bottom: 20px;">اختر لون الساحة الجديد</p>
            <div class="color-grid">
                <div class="color-btn" style="background: var(--red);" onclick="UI.resolveColor('red')"></div>
                <div class="color-btn" style="background: var(--blue);" onclick="UI.resolveColor('blue')"></div>
                <div class="color-btn" style="background: var(--green);" onclick="UI.resolveColor('green')"></div>
                <div class="color-btn" style="background: var(--yellow);" onclick="UI.resolveColor('yellow')"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal-player-select">
        <div class="center-box glass-panel">
            <h2 style="color: var(--yellow); margin-bottom: 15px;">قانون الـ 7!</h2>
            <p style="color: #94a3b8; margin-bottom: 20px;">اختر ضحية لتبديل أوراقك معها:</p>
            <div id="player-select-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
    </div>

    <script>
        /**
         * Enterprise Grade Game Architecture
         * مقسم إلى كائنات (Objects) لترتيب المنطق البرمجي المعقد.
         */

        const Utils = {
            id: () => Math.random().toString(36).substr(2, 9),
            toast: (msg) => {
                let c = document.getElementById('toast-container');
                let t = document.createElement('div'); t.className = 'toast'; t.innerText = msg;
                c.appendChild(t); setTimeout(() => t.remove(), 2800);
            },
            switchScreen: (id) => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        };

        // 1. إدارة الشبكة والحالة المركزية
        const Network = {
            ws: null, myId: Utils.id(), myName: "", isHost: false,
            state: { status: 'waiting', players: [], deck: [], discardPile: [], turnIdx: 0, direction: 1, stackAmount: 0, activeColor: '' },

            init: (asHost) => {
                let name = document.getElementById('playerName').value.trim();
                if(!name) return Utils.toast("حقل الاسم مطلوب!");
                Network.myName = name; Network.isHost = asHost;
                
                if(asHost) {
                    document.getElementById('btn-start-game').style.display = 'block';
                    document.getElementById('wait-msg').style.display = 'none';
                    Network.state.players.push({ id: Network.myId, name: Network.myName, hand: [], eliminated: false, calledUno: false });
                }

                Network.ws = new WebSocket(`ws://${location.host}/ws`);
                Network.ws.onopen = () => {
                    Utils.switchScreen('screen-lobby');
                    Network.ws.send(JSON.stringify({ type: 'join', id: Network.myId, name: Network.myName }));
                    if(asHost) UI.renderLobby();
                };

                Network.ws.onmessage = (e) => {
                    let data = JSON.parse(e.data);
                    if (Network.isHost && data.type === 'join' && data.id !== Network.myId) {
                        Network.state.players.push({ id: data.id, name: data.name, hand: [], eliminated: false, calledUno: false });
                        Network.broadcast();
                    } else if (Network.isHost && data.type === 'action') {
                        Engine.processAction(data.actionData);
                    } else if (data.type === 'state_update') {
                        Network.state = data.state;
                        if(Network.state.status === 'waiting') UI.renderLobby();
                        else if (Network.state.status === 'playing') UI.renderGame();
                    }
                };
            },
            broadcast: () => {
                if(!Network.isHost) return;
                Network.ws.send(JSON.stringify({ type: 'state_update', state: Network.state }));
                if(Network.state.status === 'waiting') UI.renderLobby(); else UI.renderGame();
            },
            sendAction: (data) => {
                if(Network.isHost) Engine.processAction(data);
                else Network.ws.send(JSON.stringify({ type: 'action', actionData: data }));
            }
        };

        // 2. المحرك المنطقي للعبة (Game Engine) - صارم جداً
        const Engine = {
            startGame: () => {
                if(Network.state.players.length < 2) return Utils.toast("تحتاج لضحية أخرى على الأقل!");
                Network.state.deck = Engine.generateDeck();
                Network.state.players.forEach(p => { p.hand = []; for(let i=0; i<7; i++) p.hand.push(Network.state.deck.pop()); });

                let firstCard;
                do { firstCard = Network.state.deck.pop(); if(isNaN(firstCard.val)) Network.state.deck.unshift(firstCard); } while (isNaN(firstCard.val));

                Network.state.discardPile = [firstCard]; Network.state.activeColor = firstCard.color;
                Network.state.status = 'playing'; Network.state.turnIdx = 0;
                Network.broadcast();
            },
            generateDeck: () => {
                let d = []; const colors = ['red', 'blue', 'green', 'yellow']; let idC = 0;
                colors.forEach(c => {
                    for(let i=1; i<=9; i++) { for(let j=0; j<3; j++) d.push({id: idC++, color: c, val: i.toString(), draw: 0}); }
                    d.push({id: idC++, color: c, val: '0', draw:0}); d.push({id: idC++, color: c, val: '0', draw:0});
                    d.push({id: idC++, color: c, val: '7', draw:0}); d.push({id: idC++, color: c, val: '7', draw:0});
                    for(let j=0; j<3; j++) { d.push({id: idC++, color: c, val: 'Skip', draw:0}); d.push({id: idC++, color: c, val: 'Rev', draw:0}); d.push({id: idC++, color: c, val: '+2', draw:2}); }
                    d.push({id: idC++, color: c, val: '+4', draw:4}); d.push({id: idC++, color: c, val: '+4', draw:4});
                });
                for(let i=0; i<6; i++) { d.push({id: idC++, color: 'black', val: 'W', draw:0}); d.push({id: idC++, color: 'black', val: 'W+6', draw:6}); d.push({id: idC++, color: 'black', val: 'W+10', draw:10}); }
                return d.sort(() => Math.random() - 0.5);
            },
            processAction: (act) => {
                let s = Network.state; let activeP = s.players[s.turnIdx];
                if(act.playerId !== activeP.id) return;

                if(act.type === 'play_card') {
                    let p = s.players.find(pl => pl.id === act.playerId);
                    let cIdx = p.hand.findIndex(c => c.id === act.cardId);
                    let card = p.hand[cIdx];

                    // التحقق الصارم
                    if(s.stackAmount > 0 && card.draw < s.discardPile[s.discardPile.length-1].draw) return; 
                    if(card.color !== 'black' && card.color !== s.activeColor && card.val !== s.discardPile[s.discardPile.length-1].val) return;

                    p.hand.splice(cIdx, 1); s.discardPile.push(card);
                    if(card.color !== 'black') s.activeColor = card.color; else if(act.selectedColor) s.activeColor = act.selectedColor;
                    if(card.draw > 0) s.stackAmount += card.draw;
                    
                    let skips = 1;
                    if(card.val === 'Rev') s.direction *= -1;
                    if(card.val === 'Skip' || (card.val === 'Rev' && s.players.filter(pl=>!pl.eliminated).length === 2)) skips = 2;

                    if(card.val === '0') Engine.passHands();
                    if(card.val === '7' && act.targetId) Engine.swapHands(act.playerId, act.targetId);

                    if(p.hand.length === 0) { s.status = 'finished'; Network.broadcast(); return; }
                    Engine.advanceTurn(skips);
                } 
                else if (act.type === 'draw_card') {
                    let p = s.players.find(pl => pl.id === act.playerId);
                    let draws = s.stackAmount > 0 ? s.stackAmount : 1;
                    for(let i=0; i<draws; i++) {
                        p.hand.push(s.deck.pop());
                        if(p.hand.length >= 25) { p.eliminated = true; break; } // Mercy Rule
                    }
                    s.stackAmount = 0;
                    if(s.players.filter(pl=>!pl.eliminated).length <= 1) { s.status = 'finished'; Network.broadcast(); return; }
                    Engine.advanceTurn(1);
                }
                Network.broadcast();
            },
            advanceTurn: (steps) => {
                do { Network.state.turnIdx = (Network.state.turnIdx + (Network.state.direction * steps) + Network.state.players.length) % Network.state.players.length; steps = 1; } while (Network.state.players[Network.state.turnIdx].eliminated);
            },
            passHands: () => {
                let active = Network.state.players.filter(p => !p.eliminated);
                if(Network.state.direction === 1) { let temp = [...active[0].hand]; for(let i=0; i<active.length-1; i++) active[i].hand = [...active[i+1].hand]; active[active.length-1].hand = temp; } 
                else { let temp = [...active[active.length-1].hand]; for(let i=active.length-1; i>0; i--) active[i].hand = [...active[i-1].hand]; active[0].hand = temp; }
            },
            swapHands: (id1, id2) => {
                let p1 = Network.state.players.find(p=>p.id === id1); let p2 = Network.state.players.find(p=>p.id === id2);
                let temp = [...p1.hand]; p1.hand = [...p2.hand]; p2.hand = temp;
            }
        };

        // 3. واجهة المستخدم والتحكم (UI Controller)
        const UI = {
            selectedCardId: null, pendingPlay: null,
            
            renderLobby: () => {
                let html = ''; Network.state.players.forEach(p => { html += `<div class="glass-panel" style="padding: 15px; text-align: left; padding-right:20px; font-weight:bold;">👤 ${p.name}</div>`; });
                document.getElementById('lobby-players').innerHTML = html;
            },
            renderGame: () => {
                Utils.switchScreen('screen-game');
                let s = Network.state; let me = s.players.find(p => p.id === Network.myId); let activeP = s.players[s.turnIdx]; let isMyTurn = (activeP.id === Network.myId);

                document.getElementById('hud-turn').innerText = `الدور: ${activeP.name}`;
                let stackEl = document.getElementById('hud-stack');
                if(s.stackAmount > 0) { stackEl.innerText = `⚠️ تراكم: +${s.stackAmount}`; stackEl.style.display = 'block'; } else stackEl.style.display = 'none';

                let oppHtml = '';
                s.players.forEach(p => {
                    if(p.id !== Network.myId && !p.eliminated) {
                        let classes = 'opp-avatar glass-panel'; if(p.id === activeP.id) classes += ' active'; if(p.hand.length >= 20) classes += ' danger';
                        oppHtml += `<div class="${classes}">${p.name}<br><span style="font-size:0.9rem; color:#94a3b8;">${p.hand.length} أوراق</span></div>`;
                    }
                });
                document.getElementById('opponents-ring').innerHTML = oppHtml;

                let topCard = s.discardPile[s.discardPile.length - 1];
                let tcColor = topCard.color === 'black' ? s.activeColor : topCard.color;
                document.getElementById('top-card').className = `card-3d ${tcColor}`;
                document.getElementById('top-card').innerHTML = `<div class="c-val ${topCard.val.length > 2 ? 'sm':''}">${topCard.val}</div>`;

                let handHtml = '';
                if(me.eliminated) { handHtml = `<h2 style="color:var(--red);">💀 تم طردك (قاعدة الرحمة)</h2>`; } 
                else {
                    me.hand.forEach((c, idx) => {
                        let isSel = (UI.selectedCardId === c.id) ? 'selected' : '';
                        let isValid = (s.stackAmount === 0 || c.draw >= topCard.draw);
                        let dis = (!isMyTurn || !isValid) ? 'disabled' : '';
                        handHtml += `<div class="card-3d ${c.color} ${isSel} ${dis}" style="z-index:${idx}" onclick="UI.selectCard('${c.id}', ${isMyTurn}, ${isValid}, '${c.color}', '${c.val}')"><div class="c-val ${c.val.length > 2 ? 'sm':''}">${c.val}</div></div>`;
                    });
                }
                document.getElementById('my-hand').innerHTML = handHtml;

                let playBtn = document.getElementById('btn-play-selected');
                if(UI.selectedCardId && isMyTurn) { playBtn.classList.remove('disabled'); playBtn.classList.add('highlight'); } 
                else { playBtn.classList.add('disabled'); playBtn.classList.remove('highlight'); }

                let unoBtn = document.getElementById('uno-call-btn');
                if(me.hand.length === 2 && !me.calledUno) unoBtn.classList.add('alert'); else unoBtn.classList.remove('alert');
            },
            selectCard: (id, isMyTurn, isValid, color, val) => {
                if(!isMyTurn) return Utils.toast("انتظر دورك بصبر!");
                if(!isValid) return Utils.toast("يجب اللعب بورقة سحب أعلى بسبب التراكم!");
                UI.selectedCardId = (UI.selectedCardId === id) ? null : id;
                UI.renderGame();
            },
            confirmPlay: () => {
                if(!UI.selectedCardId) return;
                let me = Network.state.players.find(p => p.id === Network.myId);
                let card = me.hand.find(c => c.id === UI.selectedCardId);
                
                if(card.color === 'black') { UI.pendingPlay = { type: 'play_card', playerId: Network.myId, cardId: card.id }; document.getElementById('modal-color').classList.add('active'); } 
                else if (card.val === '7') { UI.pendingPlay = { type: 'play_card', playerId: Network.myId, cardId: card.id }; UI.showPlayerSelectModal(); } 
                else { Network.sendAction({ type: 'play_card', playerId: Network.myId, cardId: card.id }); UI.selectedCardId = null; }
            },
            resolveColor: (col) => { document.getElementById('modal-color').classList.remove('active'); if(UI.pendingPlay) { UI.pendingPlay.selectedColor = col; Network.sendAction(UI.pendingPlay); UI.pendingPlay = null; UI.selectedCardId = null; } },
            showPlayerSelectModal: () => {
                let html = ''; Network.state.players.forEach(p => { if(p.id !== Network.myId && !p.eliminated) { html += `<button class="btn-ultra" onclick="UI.resolvePlayer7('${p.id}')">${p.name} (${p.hand.length} ورقة)</button>`; } });
                document.getElementById('player-select-list').innerHTML = html; document.getElementById('modal-player-select').classList.add('active');
            },
            resolvePlayer7: (targetId) => { document.getElementById('modal-player-select').classList.remove('active'); if(UI.pendingPlay) { UI.pendingPlay.targetId = targetId; Network.sendAction(UI.pendingPlay); UI.pendingPlay = null; UI.selectedCardId = null; } },
            drawCard: () => { let activeP = Network.state.players[Network.state.turnIdx]; if(activeP.id !== Network.myId) return Utils.toast("ليس دورك!"); Network.sendAction({ type: 'draw_card', playerId: Network.myId }); },
            sortHand: () => { let me = Network.state.players.find(p => p.id === Network.myId); me.hand.sort((a,b) => a.color.localeCompare(b.color)); UI.renderGame(); Utils.toast("تم ترتيب الأوراق حسب اللون!"); },
            showFullHand: () => { Utils.toast("ميزة العرض الكامل سيتم فتحها قريباً كلوحة مستقلة!"); },
            callUno: () => { let me = Network.state.players.find(p => p.id === Network.myId); me.calledUno = true; Utils.toast("أونو! لقد تم تسجيل نداءك."); UI.renderGame(); }
        };

        // نقطة الإطلاق
        const App = { initNetwork: Network.init };
    </script>
</body>
</html>
